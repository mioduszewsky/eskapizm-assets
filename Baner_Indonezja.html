<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eskapizm — Baner Indonezja</title>
<style>
/* Uwaga: obrazki muszą mieć adresy absolutne. Baner jest wstrzykiwany przez
   embed.js do obcej strony, gdzie ścieżki względne rozwiązałyby się do jej domeny. */
.esk-bn, .esk-bn * { box-sizing: border-box; margin: 0; padding: 0; }

.esk-bn {
  position: relative;
  display: block;
  line-height: 0;
  text-decoration: none;
  border-radius: 16px;
  overflow: hidden;
}
.esk-bn__img { width: 100%; height: auto; display: block; border: 0; }

/* obszar kursora — stoi w miejscu, dzięki temu podnoszący się
   przycisk nie ucieka spod kursora i nie migocze */
.esk-bn__cta {
  position: absolute;
  display: block;
  border-radius: 999px;
}
.esk-bn__cta img { width: 100%; height: auto; display: block; border: 0; }

/* warstwa, która się rusza */
.esk-bn__cta-in {
  position: relative;
  display: block;
  filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.26));
  transition: transform 0.22s ease, filter 0.22s ease;
  will-change: transform;
}

/* wariant żółty leży dokładnie na białym */
.esk-bn__cta-hover {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.22s ease;
}

/* żółty na hover samego przycisku (desktop) oraz na wciśnięciu — to drugie
   obsługuje dotyk, gdzie hover nie istnieje. :active bierzemy z linku, bo
   iOS Safari nie nadaje go zagnieżdżonym elementom niebędącym linkiem. */
.esk-bn__cta:hover .esk-bn__cta-hover,
.esk-bn:active .esk-bn__cta-hover { opacity: 1; }

.esk-bn__cta:hover .esk-bn__cta-in {
  transform: translateY(-3px);
  filter: drop-shadow(0 11px 20px rgba(0, 0, 0, 0.34));
}
.esk-bn:active .esk-bn__cta-in {
  transform: translateY(-1px);
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.30));
}

/* ——— desktop ——— */
.esk-bn__cta--d {
  left: 61.3303%;
  top: 84.3292%;
  width: 35.5130%;
}
.esk-bn__cta--m { display: none; }

/* ——— mobilka: osobna kreacja pionowa, bo baner 2:1 zwężony do szerokości
   telefonu daje nieczytelnie małą typografię ——— */
@media (max-width: 640px) {
  /* pełna szerokość ekranu: obrazek ma width:100%, więc sam nie wyjdzie poza
     kolumnę artykułu na blogu partnera — wypychamy go poza jej padding */
  .esk-bn {
    width: 100vw;
    margin-left: 50%;
    transform: translateX(-50%);
    border-radius: 0;
  }
  .esk-bn__cta--d { display: none; }
  .esk-bn__cta--m {
    display: block;
    left: 11.2037%;
    top: 88.9018%;
    width: 77.5926%;
  }
}
</style>
</head>
<body>
<a class="esk-bn" target="_blank" rel="noopener" href="https://eskapizm.com/indonezja">
  <picture>
    <source media="(max-width: 640px)" srcset="https://mioduszewsky.github.io/eskapizm-assets/baner-indonezja-mobile.jpg">
    <img class="esk-bn__img" src="https://mioduszewsky.github.io/eskapizm-assets/baner-indonezja.jpg" alt="Twój plan wyjazdu do Indonezji — eskapizm">
  </picture>

  <span class="esk-bn__cta esk-bn__cta--d" aria-hidden="true">
    <span class="esk-bn__cta-in">
      <img src="https://mioduszewsky.github.io/eskapizm-assets/cta-indonezja.png" alt="">
      <img class="esk-bn__cta-hover" src="https://mioduszewsky.github.io/eskapizm-assets/cta-indonezja-hover.png" alt="">
    </span>
  </span>

  <span class="esk-bn__cta esk-bn__cta--m" aria-hidden="true">
    <span class="esk-bn__cta-in">
      <img src="https://mioduszewsky.github.io/eskapizm-assets/cta-indonezja-mobile.png" alt="">
      <img class="esk-bn__cta-hover" src="https://mioduszewsky.github.io/eskapizm-assets/cta-indonezja-mobile-hover.png" alt="">
    </span>
  </span>
</a>
</body>
</html>
