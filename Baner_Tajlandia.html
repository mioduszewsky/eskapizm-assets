<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eskapizm — Baner Tajlandia</title>
<style>
/* Uwaga: obrazki muszą mieć adresy absolutne. Baner jest wstrzykiwany przez
   embed.js do obcej strony, gdzie ścieżki względne rozwiązałyby się do jej domeny. */
.esk-bn, .esk-bn * { box-sizing: border-box; margin: 0; padding: 0; }

.esk-bn {
  position: relative;
  display: block;
  line-height: 0;
  text-decoration: none;
  border-radius: 16px;
  overflow: hidden;
}
.esk-bn__img { width: 100%; height: auto; display: block; border: 0; }

/* obszar kursora — stoi w miejscu, dzięki temu podnoszący się
   przycisk nie ucieka spod kursora i nie migocze */
.esk-bn__cta {
  position: absolute;
  left: 61.6122%;
  top: 84.3292%;
  width: 35.2311%;
  display: block;
  border-radius: 999px;
}

/* warstwa, która się rusza */
.esk-bn__cta-in {
  position: relative;
  display: block;
  filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.26));
  transition: transform 0.22s ease, filter 0.22s ease;
  will-change: transform;
}
.esk-bn__cta img { width: 100%; height: auto; display: block; border: 0; }

/* wariant żółty leży dokładnie na białym i wchodzi płynnie na hover */
.esk-bn__cta-hover {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.22s ease;
}

.esk-bn__cta:hover .esk-bn__cta-in {
  transform: translateY(-3px);
  filter: drop-shadow(0 11px 20px rgba(0, 0, 0, 0.34));
}
.esk-bn__cta:hover .esk-bn__cta-hover { opacity: 1; }

.esk-bn__cta:active .esk-bn__cta-in {
  transform: translateY(-1px);
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.30));
}

@media (hover: none) {
  .esk-bn__cta-in, .esk-bn__cta-hover { transition: none; }
}
</style>
</head>
<body>
<a class="esk-bn" target="_blank" rel="noopener" href="https://eskapizm.com/tajlandia">
  <img class="esk-bn__img"
       src="https://mioduszewsky.github.io/eskapizm-assets/baner-tajlandia.png"
       alt="Twój plan wyjazdu do Tajlandii — eskapizm">
  <span class="esk-bn__cta" aria-hidden="true">
    <span class="esk-bn__cta-in">
      <img src="https://mioduszewsky.github.io/eskapizm-assets/cta-tajlandia.png" alt="">
      <img class="esk-bn__cta-hover"
           src="https://mioduszewsky.github.io/eskapizm-assets/cta-tajlandia-hover.png" alt="">
    </span>
  </span>
</a>
</body>
</html>
